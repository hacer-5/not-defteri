<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Benim Not Defterim</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            padding: 12px 20px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .not-listesi {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .not-item {
            background-color: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #334155;
            font-size: 14px;
            word-break: break-word;
        }

        .bos-uyari {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Not Defterim</h1>
        
        <!-- Not Ekleme Formu -->
        <form method="POST">
            <input type="text" name="not_icerigi" placeholder="Yeni bir not yazın..." required autocomplete="off">
            <button type="submit">Ekle</button>
        </form>

        <!-- Notların Listelenmesi -->
        <ul class="not-listesi">
            {% if notlar %}
                {% for not_id, not_metni in notlar %}
                    <li class="not-item">{{ not_metni }}</li>
                {% endfor %}
            {% else %}
                <p class="bos-uyari">Henüz hiç not eklemedin. İlk notunu yukarıdan ekle! 🚀</p>
            {% endif %}
        </ul>
    </div>

</body>
</html>
